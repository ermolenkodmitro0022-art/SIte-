<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Шахісті - Мини-игра</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0a2e18;color:#fff;font-family:system-ui,sans-serif;touch-action:manipulation;user-select:none;-webkit-user-select:none}
  #top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:12px 16px;font-size:20px;font-weight:700;z-index:2}
  #field{position:fixed;inset:0;overflow:hidden}
  .p{position:absolute;font-size:48px;cursor:pointer;line-height:1}
  #menu{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,46,24,.94);z-index:3;text-align:center;padding:20px}
  #menu h1{margin:0 0 10px;font-size:30px}
  #menu p{margin:0 0 24px;opacity:.85}
  button{font-size:22px;padding:14px 36px;border:0;border-radius:14px;background:#2e7d32;color:#fff;font-weight:700;cursor:pointer}
  a{color:#9ad1a0;margin-top:18px}
</style>
</head>
<body>
<div id="top"><span id="score">0</span><span id="time">30</span></div>
<div id="field"></div>
<div id="menu">
  <h1>♞ Лови фигуры</h1>
  <p id="msg">Тапай по фигурам, пока время не вышло. 30 секунд!</p>
  <button id="start">Играть</button>
  <a href="index.html">← На сайт клуба</a>
</div>
<script>
const P=['♔','♕','♖','♗','♘','♙'];
const field=document.getElementById('field');
let score=0,left=30,timers=[];

function spawn(){
  const el=document.createElement('div');
  el.className='p';
  el.textContent=P[Math.random()*P.length|0];
  el.style.left=(Math.random()*(innerWidth-60))+'px';
  el.style.top='-60px';
  el.style.transition='top 2.5s linear';
  el.addEventListener('pointerdown',e=>{
    e.preventDefault();
    score++;
    document.getElementById('score').textContent=score;
    el.remove();
  });
  field.appendChild(el);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{el.style.top=innerHeight+'px'}));
  el.addEventListener('transitionend',()=>el.remove());
}

function start(){
  field.innerHTML='';
  score=0;left=30;
  document.getElementById('score').textContent=0;
  document.getElementById('time').textContent=left;
  document.getElementById('menu').style.display='none';
  timers.push(setInterval(spawn,600));
  timers.push(setInterval(()=>{
    left--;
    document.getElementById('time').textContent=left;
    if(left<=0) end();
  },1000));
}

function end(){
  timers.forEach(clearInterval);timers=[];
  field.innerHTML='';
  document.getElementById('msg').textContent='Время вышло! Твой счёт: '+score;
  document.getElementById('start').textContent='Ещё раз';
  document.getElementById('menu').style.display='flex';
}

document.getElementById('start').onclick=start;
</script>
</body>
</html>
