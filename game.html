<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Шахісті - Мини-игра</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0a2e18;color:#fff;font-family:system-ui,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}
  #hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:10px 16px;font-size:20px;font-weight:700;z-index:2;pointer-events:none}
  canvas{display:block;width:100vw;height:100vh}
  #menu{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,46,24,.92);z-index:3;text-align:center;padding:20px}
  #menu h1{margin:0 0 8px;font-size:32px}
  #menu p{margin:4px 0 20px;opacity:.85;max-width:300px}
  button{font-size:22px;padding:14px 36px;border:0;border-radius:14px;background:#2e7d32;color:#fff;font-weight:700}
  a{color:#9ad1a0;margin-top:18px}
</style>
</head>
<body>
<div id="hud"><span id="score">Счёт: 0</span><span id="lives">❤❤❤</span></div>
<canvas id="c"></canvas>
<div id="menu">
  <h1>♞ Ловец фигур</h1>
  <p id="msg">Двигай палец влево-вправо и лови шахматные фигуры. Не пропускай их — только 3 жизни! Бомб 💣 лови не надо.</p>
  <button id="start">Играть</button>
  <a href="index.html">← На сайт клуба</a>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H;
function resize(){const d=window.devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0)}
resize();addEventListener('resize',resize);
const PIECES=['♔','♕','♖','♗','♘','♙'];
let px,items,score,lives,t,running=false,best=+localStorage.getItem('catch_best')||0;
const PW=90;
function reset(){px=W/2;items=[];score=0;lives=3;t=0;upd()}
function upd(){document.getElementById('score').textContent='Счёт: '+score+' (рекорд '+best+')';document.getElementById('lives').textContent='❤'.repeat(Math.max(lives,0))}
function move(e){const x=(e.touches?e.touches[0]:e).clientX;px=Math.max(PW/2,Math.min(W-PW/2,x));e.preventDefault()}
cv.addEventListener('touchstart',move,{passive:false});
cv.addEventListener('touchmove',move,{passive:false});
cv.addEventListener('mousemove',move);
function loop(){
  if(!running)return;
  t++;
  const speed=2.5+score/40;
  if(t%Math.max(18,50-Math.floor(score/5))===0)items.push({x:30+Math.random()*(W-60),y:-30,bomb:Math.random()<.18,ch:PIECES[Math.random()*6|0]});
  ctx.clearRect(0,0,W,H);
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(const it of items){
    it.y+=speed;
    ctx.font='44px serif';ctx.fillStyle='#fff';
    ctx.fillText(it.bomb?'💣':it.ch,it.x,it.y);
  }
  const py=H-70;
  ctx.fillStyle='#2e7d32';ctx.fillRect(px-PW/2,py,PW,18);
  ctx.fillStyle='#fff';ctx.fillRect(px-PW/2,py,PW,4);
  for(let i=items.length-1;i>=0;i--){
    const it=items[i];
    if(it.y>py-10&&it.y<py+20&&Math.abs(it.x-px)<PW/2+10){
      items.splice(i,1);
      if(it.bomb){lives--;navigator.vibrate&&navigator.vibrate(100)}else score++;
      upd();
    }else if(it.y>H+30){
      items.splice(i,1);
      if(!it.bomb){lives--;upd()}
    }
  }
  if(lives<=0){
    running=false;
    if(score>best){best=score;localStorage.setItem('catch_best',best)}
    document.getElementById('msg').textContent='Игра окончена! Счёт: '+score+'. Рекорд: '+best;
    document.getElementById('start').textContent='Ещё раз';
    document.getElementById('menu').style.display='flex';
    return;
  }
  requestAnimationFrame(loop);
}
document.getElementById('start').onclick=()=>{
  document.getElementById('menu').style.display='none';
  reset();running=true;requestAnimationFrame(loop);
};
</script>
</body>
</html>
