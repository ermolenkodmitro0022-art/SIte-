<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Шахісті - Новости</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>

<header>
    <h1>Новости</h1>
    <p>События и объявления</p>
</header>

<nav>
    <a href="index.html">Главная</a>
    <a href="news.html">Новости</a>
    <a href="tournaments.html">Турниры</a>
    <a href="rules.html">Правила</a>
</nav>

<div class="container" id="news-container">
    <!-- News items will be loaded here from localStorage -->
</div>

<footer>
    <p>&copy; 2026 Шахматный клуб "Шахісті".</p>
</footer>

<!-- Secret Admin Button -->
<a href="admin.html" class="admin-trigger" title="Admin Panel"></a>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const newsContainer = document.getElementById('news-container');
        const storedNews = JSON.parse(localStorage.getItem('chess_news') || '[]');

        if (storedNews.length === 0) {
            newsContainer.innerHTML = '<p style="text-align:center; color:#777;">Новостей пока нет.</p>';
            return;
        }

        // Render stored news in reverse order (newest first)
        storedNews.reverse().forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';

            let imageHtml = '';
            if (item.image) {
                imageHtml = `<img src="${item.image}" alt="News Image">`;
            }

            card.innerHTML = `
                <span class="date">${item.date}</span>
                <h2>${item.title}</h2>
                <p>${item.content}</p>
                ${imageHtml}
            `;
            newsContainer.appendChild(card);
        });
    });
</script>

</body>
</html>
